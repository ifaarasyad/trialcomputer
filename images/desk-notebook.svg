<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Notebook and a plant on a desk">
  <defs>
    <clipPath id="clip"><rect width="640" height="440" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="640" height="440" fill="#f6f3ec"/>
    <circle cx="540" cy="70" r="70" fill="#ffe2a0" opacity=".6"/>
    <circle cx="60" cy="120" r="50" fill="#cfe2ff" opacity=".7"/>
    <rect y="290" width="640" height="150" fill="#d9b48a"/>
    <path d="M0 322h640M0 358h640M0 394h640" stroke="#c99f72" stroke-width="3" opacity=".6"/>

    <!-- plant -->
    <path d="M520 250c-50-20-62-86-34-132 38 30 52 86 34 132z" fill="#4fae75"/>
    <path d="M526 250c40-28 62-80 44-128-44 28-62 80-44 128z" fill="#6cc48c"/>
    <path d="M522 250c-6-40 2-82 24-112-2 46-8 84-24 112z" fill="#3d9a64"/>
    <path d="M496 250h60l-8 62h-44z" fill="#e9876b"/>

    <!-- notebook -->
    <g transform="rotate(-6 250 270)">
      <rect x="90" y="150" width="300" height="190" rx="10" fill="#e6dfd0"/>
      <rect x="84" y="140" width="300" height="190" rx="10" fill="#fffdf7" stroke="#e3dccb" stroke-width="3"/>
      <path d="M110 190h250M110 226h250M110 262h250M110 298h250" stroke="#dbe6f7" stroke-width="3"/>
      <rect x="84" y="140" width="22" height="190" rx="8" fill="#1f5fd6"/>
      <text x="130" y="206" font-family="'Segoe Script','Bradley Hand','Comic Sans MS',cursive" font-size="30" font-style="italic" fill="#1f3b73">Technology</text>
      <text x="130" y="244" font-family="'Segoe Script','Bradley Hand','Comic Sans MS',cursive" font-size="30" font-style="italic" fill="#1f3b73">makes life</text>
      <text x="130" y="282" font-family="'Segoe Script','Bradley Hand','Comic Sans MS',cursive" font-size="30" font-style="italic" fill="#1f3b73">easier</text>
    </g>

    <!-- pencil -->
    <g transform="rotate(-18 400 330)">
      <rect x="330" y="322" width="130" height="14" rx="3" fill="#f5b72e"/>
      <path d="M460 322l24 7-24 7z" fill="#f1d3a6"/>
      <path d="M476 326l8 3-8 3z" fill="#3a4766"/>
      <rect x="330" y="322" width="16" height="14" rx="3" fill="#e9876b"/>
    </g>
  </g>
</svg>
