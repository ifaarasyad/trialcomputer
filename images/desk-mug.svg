<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Laptop and a coffee mug on a desk">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8cff"/>
      <stop offset="1" stop-color="#8fc0ff"/>
    </linearGradient>
    <clipPath id="clip"><rect width="640" height="440" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="640" height="440" fill="#f4f1ea"/>
    <rect y="300" width="640" height="140" fill="#d9b48a"/>
    <path d="M0 330h640M0 365h640M0 400h640" stroke="#c99f72" stroke-width="3" opacity=".6"/>
    <circle cx="90" cy="70" r="60" fill="#ffe2a0" opacity=".55"/>

    <!-- plant -->
    <path d="M592 230c-30-10-34-52-18-82 22 18 30 52 18 82zM596 230c26-14 40-48 30-80-24 14-38 48-30 80z" fill="#5fb67f"/>
    <rect x="572" y="222" width="46" height="46" rx="8" fill="#e9876b"/>

    <!-- laptop -->
    <rect x="70" y="100" width="290" height="190" rx="14" fill="#2b3548"/>
    <rect x="84" y="114" width="262" height="162" rx="6" fill="url(#screen)"/>
    <circle cx="104" cy="132" r="5" fill="#fff" opacity=".8"/>
    <circle cx="122" cy="132" r="5" fill="#fff" opacity=".6"/>
    <rect x="104" y="160" width="130" height="12" rx="6" fill="#fff" opacity=".85"/>
    <rect x="104" y="184" width="190" height="10" rx="5" fill="#fff" opacity=".6"/>
    <rect x="104" y="206" width="160" height="10" rx="5" fill="#fff" opacity=".6"/>
    <circle cx="300" cy="236" r="22" fill="#fff" opacity=".9"/>
    <path d="M290 236l8 8 14-16" fill="none" stroke="#1f6feb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 290h342l-22 26H66z" fill="#cfd5df"/>

    <!-- mug -->
    <ellipse cx="476" cy="326" rx="70" ry="12" fill="#000" opacity=".12"/>
    <path d="M530 236q44 0 44 36t-44 36" fill="none" stroke="#e2e8f2" stroke-width="14" stroke-linecap="round"/>
    <rect x="420" y="200" width="112" height="126" rx="16" fill="#fff" stroke="#e1e6ee" stroke-width="3"/>
    <text x="476" y="250" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="19" font-weight="700" fill="#3a4766">Better</text>
    <text x="476" y="276" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="19" font-weight="700" fill="#3a4766">Tech</text>
    <text x="476" y="302" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="19" font-weight="700" fill="#3a4766">Together</text>
